[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anc-studio"
version = "1.0.0"
description = "Real-time neural noise cancellation (DeepFilterNet3) with a local web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "onnxruntime>=1.17",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
anc = "anc.__main__:main"

[tool.setuptools]
packages = ["anc"]

[tool.setuptools.package-data]
anc = ["web/*", "models/deepfilternet3/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
